# Strict static type-checking configuration.
#
# Run from the project root (inside the venv) with:
#     mypy .
#
# First-party packages (assets, training, webapp, and the top-level scripts)
# are checked under --strict. Third-party libraries that ship no usable type
# information are scoped out below with `ignore_missing_imports` so their weak
# stubs do not force `# type: ignore` noise into our own code.
#
# Dev dependencies needed for the typed third-party libraries (install in the
# venv alongside mypy):
#     pip install mypy pandas-stubs types-psycopg2 types-requests \
#                 types-python-dateutil sqlalchemy[mypy]

[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
show_error_codes = True
show_column_numbers = True
pretty = True

# Treat the repo as a flat collection of top-level packages/modules so the
# `assets`, `training` and `webapp` packages resolve without an installed dist.
namespace_packages = True
explicit_package_bases = True

# Exclude the venv and the adjusted-close report (typed pass still pending; its
# twin close_report.py is now fully typed and checked under --strict).
exclude = (?x)(
    ^venv/
    | ^adjusted_close_report\.py$
  )

# --- Third-party libraries without usable type stubs -----------------------
# Each block silences "missing import" / untyped-library errors only for that
# package; our own annotations are still checked strictly.

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-keras.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-ta.*]
ignore_missing_imports = True

[mypy-optuna.*]
ignore_missing_imports = True

[mypy-schedule.*]
ignore_missing_imports = True

[mypy-yfinance.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-vaderSentiment.*]
ignore_missing_imports = True

[mypy-feedparser.*]
ignore_missing_imports = True

[mypy-flask_wtf.*]
ignore_missing_imports = True

[mypy-flask_login.*]
ignore_missing_imports = True

[mypy-flask_migrate.*]
ignore_missing_imports = True

[mypy-wtforms.*]
ignore_missing_imports = True
